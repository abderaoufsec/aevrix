# Aevrix HTTP Server Configuration
# This file contains the configuration for the Aevrix HTTP server.
# Lines starting with # are comments.

# Server binding
host = 127.0.0.1
port = 8080

# Worker pool
workers = 4

# Static file serving
document_root = ./public

# Timeouts (milliseconds)
header_timeout_ms = 10000
body_timeout_ms = 30000
keep_alive_timeout_ms = 5000
write_timeout_ms = 30000

# Resource limits
max_connections = 1000
max_buffer_size = 65536
max_request_body = 10485760

# TLS/HTTPS configuration (Phase 21)
#tls_enabled = false
#tls_cert_file = /etc/aevrix/cert.pem
#tls_key_file = /etc/aevrix/key.pem
#tls_min_version = TLSv1.2
#tls_max_version = TLSv1.3
#tls_port = 8443

# WebSocket upgrade configuration (Phase 23, RFC 6455)
# Disabled by default; enable and list the paths that may upgrade.
#websocket_enabled = false
#websocket_paths = /ws
#websocket_max_message_bytes = 1048576
#websocket_close_timeout_ms = 5000
#websocket_ping_interval_ms = 0
