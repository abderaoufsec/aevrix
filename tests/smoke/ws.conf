# Aevrix Phase 23 live WebSocket verification config
host = 127.0.0.1
port = 18081

workers = 2
document_root = public

header_timeout_ms = 10000
body_timeout_ms = 30000
keep_alive_timeout_ms = 5000
write_timeout_ms = 30000

max_connections = 200
max_buffer_size = 65536
max_request_body = 1048576

# WebSocket (Phase 23)
websocket_enabled = true
websocket_paths = /ws
# 64 KB ceiling: exercises the 64-bit frame length form (exactly 65536 bytes)
# while still allowing the oversize rejection test (66000 > 65536).
websocket_max_message_bytes = 65536
websocket_close_timeout_ms = 2000
websocket_ping_interval_ms = 0
websocket_allowed_origins = http://allowed.example
