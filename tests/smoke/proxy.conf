# Aevrix Phase 22 live proxy verification config
host = 127.0.0.1
port = 18080

workers = 2
document_root = public

header_timeout_ms = 10000
body_timeout_ms = 30000
keep_alive_timeout_ms = 5000
write_timeout_ms = 30000

max_connections = 200
max_buffer_size = 65536
max_request_body = 1048576

# Reverse proxy
proxy_enabled = true
proxy_pass = http://127.0.0.1:19000
proxy_prefix = /api
proxy_strip_prefix = true
proxy_connect_timeout_ms = 2000
proxy_read_timeout_ms = 2000
proxy_max_idle_connections = 4
proxy_max_response_bytes = 65536
proxy_idle_timeout_ms = 5000
